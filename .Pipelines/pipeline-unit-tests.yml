# ADO pipeline that runs the msal Python unit tests only.
# No lab cert, no e2e — those live in azure-pipelines.yml / future e2e pipeline.

trigger:
  branches:
    include:
    - 4gust/ado-pipeline
pr: none

stages:
- stage: UnitTests
  displayName: 'Run unit tests'
  jobs:
  - job: Test
    displayName: 'pytest (unit only)'
    pool:
      vmImage: ubuntu-22.04
    strategy:
      matrix:
        Python39:
          python.version: '3.9'
        Python310:
          python.version: '3.10'
        Python311:
          python.version: '3.11'
        Python312:
          python.version: '3.12'
        Python313:
          python.version: '3.13'
        Python314:
          python.version: '3.14'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
      displayName: 'Set up Python'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-azurepipelines
      displayName: 'Install dependencies'

    - bash: |
        mkdir -p test-results
        set -o pipefail
        pytest -vv \
          --junitxml=test-results/junit.xml \
          --ignore=tests/test_e2e.py \
          --ignore=tests/test_e2e_manual.py \
          --ignore=tests/test_fmi_e2e.py \
          2>&1 | tee test-results/pytest.log
      displayName: 'Run unit tests'

    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results/junit.xml'
        failTaskOnFailedTests: true
        testRunTitle: 'Python $(python.version)'
