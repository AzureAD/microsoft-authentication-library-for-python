name: Native Primitives Windows CI

on:
  push:
    branches: [dev]
    paths:
      - "native/**"
      - "msal/_native*.py"
      - "msal/_managed_identity*.py"
      - "msal/managed_identity.py"
      - "msal/token_cache.py"
      - "tests/test_native_mtls.py"
      - "tests/test_managed_identity_v2.py"
      - "tests/test_token_cache.py"
      - "requirements.txt"
      - "setup.py"
      - "setup.cfg"
      - ".github/workflows/native-primitives.yml"
  pull_request:
    branches: [dev, feature/native-primitives]
    paths:
      - "native/**"
      - "msal/_native*.py"
      - "msal/_managed_identity*.py"
      - "msal/managed_identity.py"
      - "msal/token_cache.py"
      - "tests/test_native_mtls.py"
      - "tests/test_managed_identity_v2.py"
      - "tests/test_token_cache.py"
      - "requirements.txt"
      - "setup.py"
      - "setup.cfg"
      - ".github/workflows/native-primitives.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: native

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Fetch pinned vcpkg baseline
        run: |
          $manifest = Get-Content vcpkg.json | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --refetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Fetching the native vcpkg baseline failed." }

      - name: Configure native test harness
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw "Configuring the native test harness failed." }

      - name: Run complete matrix
        run: .\scripts\test.ps1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python test dependencies
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install -r requirements.txt pytest-timeout
          if ($LASTEXITCODE -ne 0) { throw "Installing Python test dependencies failed." }

      - name: Test Python and native integration
        working-directory: ${{ github.workspace }}
        run: |
          $env:MSAL_TEST_NATIVE_MTLS_DIR = (Resolve-Path .\native\artifacts\Release).Path
          python -m pytest -q --timeout=120 `
            tests\test_managed_identity_v2.py tests\test_native_mtls.py tests\test_token_cache.py `
            --junitxml=test-results\junit-native-python.xml
          if ($LASTEXITCODE -ne 0) { throw "Python native integration tests failed." }

      - name: Upload Python native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-python-tests
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  dependency-policy:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check
