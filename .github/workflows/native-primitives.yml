name: Native Primitives Windows CI

on:
  push:
    branches: [dev]
    paths:
      - "native/**"
      - ".github/workflows/native-primitives.yml"
  pull_request:
    branches: [dev]
    paths:
      - "native/**"
      - ".github/workflows/native-primitives.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: native

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Fetch pinned vcpkg baseline
        run: |
          $manifest = Get-Content vcpkg.json | ConvertFrom-Json
          $baseline = $manifest.'builtin-baseline'
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --refetch --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw "Fetching the native vcpkg baseline failed." }

      - name: Configure native test harness
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { throw "Configuring the native test harness failed." }

      - name: Run complete matrix
        run: .\scripts\test.ps1

  dependency-policy:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1-x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
          fallback: none

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Enforce dependency policy
        run: cargo deny check
