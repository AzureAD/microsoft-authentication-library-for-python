# Build verification for the msal Python package.
#
# This workflow runs on every PR (against any target branch) to give contributors
# fast feedback that the package still builds and that the distribution metadata
# passes `twine check`.
#
# Stacked PRs targeting feature/native-primitives also run secret-free unit tests
# here because the IDDP/ADO gate targets dev and skips drafts.
# E2E tests, benchmarks, SDL scans, and PyPI publishing remain in IDDP/ADO:
#   - azure-pipelines.yml             (PRs + pushes: unit + E2E + benchmarks + SDL)
#   - .Pipelines/pipeline-publish.yml (manual release to TestPyPI / PyPI)

name: Build

on:
  pull_request:
    # No `branches` filter — run on PRs against any target branch.

jobs:
  unit-tests:
    name: Stacked unit tests (Python ${{ matrix.python-version }})
    if: github.base_ref == 'feature/native-primitives'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install test dependencies
      run: python -m pip install -r requirements.txt pytest-timeout
    - name: Run unit tests without live credentials
      run: |
        python -m pytest -q --benchmark-skip --timeout=120 \
          --junitxml=test-results/junit-unit.xml \
          --ignore=tests/test_e2e.py \
          --ignore=tests/test_e2e_manual.py \
          --ignore=tests/test_fmi_e2e.py \
          --ignore=tests/test_mi_e2e.py \
          --deselect tests/test_cryptography.py::CryptographyTestCase::test_ceiling_should_be_latest_cryptography_version_plus_three \
          --deselect tests/test_cryptography.py::CryptographyTestCase::test_should_be_run_with_latest_version_of_cryptography
    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: stacked-unit-tests-${{ matrix.python-version }}
        path: test-results/
        if-no-files-found: warn
        retention-days: 7

  build:
    name: Build package (sdist + wheel)
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build sdist and wheel
      run: python -m build --sdist --wheel --outdir dist/ .
    - name: Verify built artifacts
      # `twine check` catches broken long_description / metadata that would fail PyPI upload.
      run: twine check dist/*
    - name: Upload built artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist
        path: dist/
        retention-days: 7
